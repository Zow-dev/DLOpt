# DLOpt config. Put this file in the Project Zomboid game folder (next to dlopt-agent.jar).
# Delete a line to use its default. Changes apply the next time you start the game.

# Master switch. false = game runs fully stock.
enabled=true

# Max chunk grid width (odd number, 5-19). Vanilla picks 19 at 1080p.
# 9 = smallest (best FPS, but you can see black ahead when driving), 11 = default (88 tiles),
# 13 = best for driving / multiplayer (104 tiles, vanilla at 720p). Try 13 if you still see black ahead.
# This is a cap: it never makes the grid bigger than vanilla chose.
chunkGridWidth=11

# How many loaded chunks the game finishes per frame while you move (1-8).
# Vanilla = 3 (about 4 chunks per frame when crossing a chunk border).
# 2 = default (about 3 chunks per frame). 1 = smaller lag spikes but new map shows up later (black ahead when driving).
# If you still see map pop-in while driving, use 3.
chunkLoadPerFrame=2

# Java priority of the lighting thread (1-10). Vanilla = 5.
# 4 = it yields to the game and render threads on PCs with few CPU cores.
# Set 5 for vanilla.
lightingThreadPriority=4

# Mip levels the game builds for each baked chunk texture (1-11). Vanilla = 11.
# 3 = fewer GPU calls per bake. The saving is small, so compare with frameLog before you keep it.
# Very far zoom-out can look slightly shimmery. Set 11 for vanilla.
# If this line is missing, 3 is used.
bakeMipLevels=3

# Zombie LOD (new in 1.4.0). Zombies far from you are updated every few frames instead of every frame
# (the game already does this at 30/60/80 tiles; this does it earlier). Only while your average FPS is
# below zombieLodFpsBelow, so nothing changes when the game already runs fast. Same idea as PZ_Optimization's zombieSimLodTiles.
# zombieLodTiles: distance in tiles where the first extra step starts (0 = off = vanilla). Each further step is at 2x the distance.
# zombieLodSteps: how many extra steps (1-4). With 12 / 2: one step past 12 tiles, two past 24 tiles.
# If far zombies look jerky, raise zombieLodTiles (15-20) or lower zombieLodFpsBelow.
zombieLodTiles=12
zombieLodSteps=2
zombieLodFpsBelow=50

# Optional frame-time log, off by default. true = every frameLogIntervalSec seconds one summary line goes
# to console.txt and one row to dlopt-frames.csv (game folder). Use it to compare settings on your PC.
# enabled=false together with frameLog=true logs the game without the DLOpt game patches (baseline).
frameLog=false
frameLogIntervalSec=30

# Installer-only: JVM preset applied to ProjectZomboid64.json by Install.bat.
# g1  = make G1 the only garbage collector (default)
# off = do not touch GC flags
# To change it later: verify the game files in Steam, set the value, then run Install.bat again.
jvmPreset=g1
